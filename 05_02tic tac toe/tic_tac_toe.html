<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <link rel="icon" href="tic_tac_toe.ico">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/tic_tac_toe.css">
</head>

<body>
    
    <div class="back">
        <button id="btn99" class="btn" type="button" onclick="history.back()">back</button>
    </div>

    <div class="wrapper">
        <header>Tic Tac Toe</header>

        <div class="game-container">
            <div id="msgtext"></div>
            <div class="squares-container">
                <div class="squares-box">
                    <div class="squares" id="a_1"></div>
                    <div class="squares" id="a_2"></div>
                    <div class="squares" id="a_3"></div>
                    <div class="squares" id="b_1"></div>
                    <div class="squares" id="b_2"></div>
                    <div class="squares" id="b_3"></div>
                    <div class="squares" id="c_1"></div>
                    <div class="squares" id="c_2"></div>
                    <div class="squares" id="c_3"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Copyright 2026 sample Hasan Mehrab</p>
    </footer>

    
    <script src="ajax.googleapis.com"></script>
    <script src="js/snowfall.jquery.min.js"></script>
    <script src="js/tic_tac_toe.js"></script>
</body>
</html>
